<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Fisgada (anime em SVG, peça original 36)</title>
    <!-- Gramática: blixvip/html-anime (MIT). Atores em dois, FX em um, 1 plano caro, hold >= 12 q, corte por mergulho de cor.
         Roteiro de cor "Névoa de cobre": só os hexes de C. -->
    <style>
      html, body { margin: 0; background: #0f1d1f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0f1d1f; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .cam svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .drw { opacity: 0; }
      .hero { opacity: 1; }
      #dip { background: #0f1d1f; opacity: 0; z-index: 10; }
      #vig { z-index: 8; pointer-events: none;
        background: radial-gradient(ellipse 75% 62% at 50% 48%, rgba(15,29,31,0) 58%, rgba(15,29,31,0.5) 100%),
                    linear-gradient(180deg, rgba(15,29,31,0.35) 0%, rgba(15,29,31,0) 14%, rgba(15,29,31,0) 84%, rgba(15,29,31,0.4) 100%); }
      #grain { z-index: 9; pointer-events: none; opacity: 0.13; mix-blend-mode: overlay; background-size: 300px 300px; }
    </style>
    <script src="vendor/gsap.min.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="fisgada" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="s1" class="clip" data-start="0" data-duration="4.05" data-track-index="1"><div id="cam1" class="cam"><svg id="v1" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="s2" class="clip" data-start="4" data-duration="3.55" data-track-index="2"><div id="cam2" class="cam"><svg id="v2" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="s3" class="clip" data-start="7.5" data-duration="3.55" data-track-index="1"><div id="cam3" class="cam"><svg id="v3" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="s4" class="clip" data-start="11" data-duration="2.55" data-track-index="2"><div id="cam4" class="cam"><svg id="v4" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="s5" class="clip" data-start="13.5" data-duration="6.55" data-track-index="1"><div id="cam5" class="cam"><svg id="v5" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="s6" class="clip" data-start="20" data-duration="5.55" data-track-index="2"><div id="cam6" class="cam"><svg id="v6" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="s7" class="clip" data-start="25.5" data-duration="4.5" data-track-index="1"><div id="cam7" class="cam"><svg id="v7" viewBox="0 0 1080 1920"></svg></div></div>
      <div id="vig" class="clip" data-start="0" data-duration="30" data-track-index="4"></div>
      <div id="grain" class="clip" data-start="0" data-duration="30" data-track-index="5"></div>
      <div id="dip" class="clip" data-start="0" data-duration="30" data-track-index="3"></div>
    </div>
    <script>
      // ---------- roteiro de cor fechado: "Névoa de cobre" ----------
      const C = { ink: "#0f1d1f", water: "#1d3a3d", deep: "#2b5552", fog: "#93ada3", haze: "#dcc6a2", sun: "#fff0d4",
                  glow: "#eea562", accent: "#cf4527", straw: "#c8984f", ochre: "#d9a43a", skin: "#e6b08b" };
      const FPS = 24, F = (n) => n / FPS;

      // ---------- utilitários determinísticos ----------
      function lcg(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
      const f1 = (v) => (Math.round(v * 10) / 10).toString();
      const P = (p) => f1(p[0]) + "," + f1(p[1]);
      function rot(p, a, o) { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); const x = p[0] - o[0], y = p[1] - o[1]; return [o[0] + x * c - y * s, o[1] + x * s + y * c]; }
      function poly(pts, fill, extra) { return `<path d="M${pts.map(P).join(" L")} Z" fill="${fill}" ${extra || ""}/>`; }
      function smooth(pts, fill, extra) {
        const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        let d = "M" + P(mid(pts[n - 1], pts[0]));
        for (let i = 0; i < n; i++) d += " Q" + P(pts[i]) + " " + P(mid(pts[i], pts[(i + 1) % n]));
        return `<path d="${d} Z" fill="${fill}" ${extra || ""}/>`;
      }
      function stroke(pts, col, w, extra) { return `<path d="M${pts.map(P).join(" L")}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra || ""}/>`; }
      function curve(a, c, b, col, w, extra) { return `<path d="M${P(a)} Q${P(c)} ${P(b)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra || ""}/>`; }
      function ik(S, T, l1, l2, bend) {
        let dx = T[0] - S[0], dy = T[1] - S[1]; let d = Math.hypot(dx, dy);
        d = Math.max(Math.abs(l1 - l2) + 0.5, Math.min(l1 + l2 - 0.5, d));
        const a = Math.atan2(dy, dx), A = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
        const e = a + bend * A;
        return { E: [S[0] + l1 * Math.cos(e), S[1] + l1 * Math.sin(e)], W: [S[0] + d * Math.cos(a), S[1] + d * Math.sin(a)] };
      }
      const dirv = (deg) => [Math.cos(deg * Math.PI / 180), Math.sin(deg * Math.PI / 180)];
      const addv = (a, b, k) => [a[0] + b[0] * (k === undefined ? 1 : k), a[1] + b[1] * (k === undefined ? 1 : k)];
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], vlen = (v) => Math.hypot(v[0], v[1]), nrm = (v) => { const l = vlen(v) || 1; return [v[0] / l, v[1] / l]; };
      const at = (x, y, k, inner, extra, mirror) => `<g transform="translate(${x} ${y}) scale(${mirror ? -k : k} ${k})" ${extra || ""}>${inner}</g>`;
      const toAbs = (o, k, p, mirror) => [o[0] + (mirror ? -p[0] : p[0]) * k, o[1] + p[1] * k];

      // ---------- esqueleto comum (perfil olhando para +x; pés em 0,0) ----------
      function rig(p) {
        const q = Object.assign({ hip: [0, -245], lean: 0, tilt: 0, fF: [60, 0], fB: [-50, 0], hF: [70, -330], hB: [10, -300], rodLen: 560, bend: 0, rod: true, breath: 0 }, p);
        const hip = q.hip;
        const T = (x, y) => rot([hip[0] + x, hip[1] + y - (y < -100 ? q.breath : 0)], q.lean, hip);
        const Nk = T(0, -190), ang = q.lean + q.tilt;
        const Hc = addv(Nk, rot([8, -62], ang, [0, 0])), hs = 1.25;
        const H = (x, y) => rot([Hc[0] + x * hs, Hc[1] + y * hs], ang, Hc);
        const SF = T(12, -176), SB = T(-4, -172);
        const aF = ik(SF, q.hF, 92, 86, 1), aB = ik(SB, q.hB, 92, 86, 1);
        let rod = null;
        if (q.rod) {
          const d = nrm(sub(aF.W, aB.W)), butt = addv(aB.W, d, -55), st = addv(aB.W, d, q.rodLen);
          const tip = rot(st, q.bend, aF.W), ctrl = addv(aF.W, d, (q.rodLen - vlen(sub(aF.W, aB.W))) * 0.5);
          rod = { butt, hF: aF.W, hB: aB.W, ctrl, tip, d };
        }
        return { q, hip, T, H, Nk, Hc, ang, SF, SB, aF, aB, rod };
      }

      // ---------- os dois atores (boneco paramétrico, cel: chapado + contorno + 1 sombra dura + contraluz) ----------
      // cos A: pescadora no trapiche (chapéu de palha de aba larga + lenço; jaqueta verde-água; botas)
      // cos B: rapaz na canoa (capa de chuva ocre com capuz; cordões)
      function actor(p) {
        const q = Object.assign({ cos: "A", eye: "open", flap: 0, sil: null, rim: "front", hat: "on", wet: false, flare: 0, line: null, slack: 0, mouth: null, hoodLow: false, rodPoly: null }, p);
        const R = rig(q), { T, H, hip } = R;
        const S = q.sil, col = (c) => S || c;
        const OL = S ? "" : `stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"`;
        const limb = (pts, w, fill) => S ? stroke(pts, S, w) : stroke(pts, C.ink, w + 10) + stroke(pts, fill, w);
        const rimC = C.glow, fl = [0, 1, 2][q.flap % 3];
        const A = q.cos === "A";
        const coat = A ? C.deep : C.ochre, pants = A ? C.water : C.water, boots = A ? C.water : C.ink;
        let s = "";
        // braço de lá
        s += limb([R.SB, R.aB.E, R.aB.W], 26, A ? C.deep : C.ochre);
        // pernas
        const leg = (h0, foot) => {
          const k = ik(h0, foot, 128, 124, -1); let o = limb([h0, k.E, k.W], 32, pants);
          const f = k.W; o += poly([[f[0] - 22, f[1] - 30], [f[0] + 14, f[1] - 30], [f[0] + 40, f[1] - 8], [f[0] + 42, f[1] + 2], [f[0] - 24, f[1] + 2]], col(boots), OL);
          return o;
        };
        s += leg(T(-12, 8), R.q.fB) + leg(T(12, 8), R.q.fF);
        // tronco
        if (A) {
          s += poly([T(-44, -188), T(30, -192), T(48, -120), T(50, -20), T(58, 42 + q.flare * 18), T(-60, 42), T(-52, -100)], col(coat), OL);
          if (!S) {
            s += poly([T(-44, -188), T(-6, -190), T(-10, 42), T(-60, 42), T(-52, -100)], C.ink, 'opacity="0.22"');
            s += stroke([T(26, -186), T(30, -60), T(40, 36)], C.ink, 3, 'opacity="0.55"');
            s += poly([T(-30, -196), T(30, -198), T(36, -176), T(-34, -172)], C.haze, OL);           // lenço do pescoço
          }
        } else {
          const fl2 = q.flare + fl * 0.06;
          s += poly([T(-46, -188), T(32, -192), T(50, -120), T(58, -10), T(72 + fl2 * 40, 132), T(-76 - fl2 * 30, 128), T(-58, -80)], col(coat), OL);
          if (!S) {
            s += poly([T(-46, -188), T(-8, -190), T(-14, 130), T(-76 - fl2 * 30, 128), T(-58, -80)], C.ink, 'opacity="0.22"');
            s += stroke([T(30, -186), T(36, -40), T(44, 128)], C.ink, 4, 'opacity="0.6"');
            for (let i = 0; i < 3; i++) s += `<circle cx="${f1(T(40, -150 + i * 55)[0])}" cy="${f1(T(40, -150 + i * 55)[1])}" r="5" fill="${C.ink}"/>`;
            if (q.wet) s += poly([T(-46, -188), T(32, -192), T(50, -120), T(-58, -80)], C.ink, 'opacity="0.18"');
          }
        }
        // contraluz no tronco
        if (!S && q.rim) {
          if (q.rim === "front") s += stroke(A ? [T(30, -190), T(48, -120), T(50, -24)] : [T(32, -190), T(50, -120), T(58, -14)], rimC, 6);
          else s += stroke([T(-44, -186), T(-52, -100), T(-60, 30)], rimC, 6);
        }
        // vara + linha
        if (R.rod) {
          const r = R.rod;
          s += stroke([r.butt, r.hF], S ? S : C.ink, 15) + (S ? "" : stroke([r.butt, r.hF], C.straw, 8));
          s += curve(r.hF, r.ctrl, r.tip, S ? S : C.ink, 9) + (S ? "" : curve(r.hF, r.ctrl, r.tip, C.straw, 4));
          if (!S) { const rl = addv(r.hB, r.d, 22); s += `<circle cx="${f1(rl[0])}" cy="${f1(rl[1] + 14)}" r="13" fill="${C.fog}" ${OL}/>`; }
          if (q.line) {
            const L = q.line, m = [(r.tip[0] + L[0]) / 2, (r.tip[1] + L[1]) / 2 + q.slack];
            s += curve(r.tip, m, L, S ? S : C.sun, 3, S ? "" : 'opacity="0.95"');
          }
        }
        if (q.rodPoly) s += q.rodPoly;
        // braço de cá + mãos
        s += limb([R.SF, R.aF.E, R.aF.W], 28, A ? C.deep : C.ochre);
        if (!S && q.rim === "front") s += stroke([R.SF, R.aF.E], rimC, 5, 'opacity="0.8"');
        s += `<circle cx="${f1(R.aB.W[0])}" cy="${f1(R.aB.W[1])}" r="14" fill="${col(C.skin)}" ${OL}/>`;
        s += `<circle cx="${f1(R.aF.W[0])}" cy="${f1(R.aF.W[1])}" r="15" fill="${col(C.skin)}" ${OL}/>`;
        // cabeça
        const eye = (c) => {
          if (S) return "";
          const [x, y] = c;
          if (q.eye === "shut") return curve([x - 9, y], [x, y + 6], [x + 8, y - 1], C.ink, 4);
          if (q.eye === "wide") return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="9" ry="12" fill="${C.sun}" stroke="${C.ink}" stroke-width="3"/><circle cx="${f1(x + 2)}" cy="${f1(y + 1)}" r="4.5" fill="${C.ink}"/>`;
          if (q.eye === "down") return `<ellipse cx="${f1(x)}" cy="${f1(y + 3)}" rx="5" ry="6" fill="${C.ink}"/>` + curve([x - 9, y - 6], [x, y - 9], [x + 9, y - 5], C.ink, 3);
          if (q.eye === "back") return `<ellipse cx="${f1(x - 3)}" cy="${f1(y)}" rx="4.5" ry="8" fill="${C.ink}"/><circle cx="${f1(x - 4)}" cy="${f1(y - 3)}" r="1.8" fill="${C.sun}"/>`;
          return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="4.5" ry="8.5" fill="${C.ink}"/><circle cx="${f1(x + 1)}" cy="${f1(y - 3)}" r="1.8" fill="${C.sun}"/>`;
        };
        if (A) {
          s += smooth([H(-46, -30), H(-54, 12), H(-38, 44), H(-6, 48), H(8, 18), H(0, -30)], col(C.water), OL);   // lenço cobrindo a nuca
          s += smooth([H(-6, -34), H(26, -38), H(44, -16), H(53, 2), H(43, 10), H(41, 30), H(20, 44), H(-4, 40), H(-10, 0)], col(C.skin), OL);
          if (!S) {
            if (q.hat === "on") s += poly([H(-8, -36), H(50, -34), H(50, -8), H(-8, -12)], C.ink, 'opacity="0.25"');
            s += eye(H(30, -4));
            if (q.mouth === "o") s += `<ellipse cx="${f1(H(38, 26)[0])}" cy="${f1(H(38, 26)[1])}" rx="4" ry="6" fill="${C.ink}"/>`;
            else s += stroke([H(34, 26), H(42, 25)], C.ink, 3);
            if (q.rim === "front") s += curve(H(44, -16), H(56, -4), H(43, 12), rimC, 4);
          }
          if (q.hat === "on" || q.hat === "lift") {
            const lift = q.hat === "lift" ? -34 : 0, Hh = (x, y) => H(x, y + lift);
            // fitas do chapéu ao vento (variam com flap)
            if (!S) s += stroke([Hh(-50, -40), Hh(-80, -34 + fl * 6), Hh(-106, -22 + fl * 9)], C.accent, 7) + stroke([Hh(-48, -38), Hh(-70, -24 + fl * 4), Hh(-88, -6 + fl * 6)], C.accent, 6);
            s += smooth([Hh(-52, -30), Hh(-46, -74), Hh(0, -96), Hh(48, -78), Hh(56, -30)], col(C.straw), OL);
            if (!S) {
              s += poly([Hh(-52, -34), Hh(56, -34), Hh(55, -48), Hh(-50, -48)], C.accent);
              s += poly([Hh(-52, -30), Hh(-46, -74), Hh(-6, -94), Hh(-10, -30)], C.ink, 'opacity="0.2"');
            }
            const bc = Hh(4, -32);
            s += `<ellipse cx="${f1(bc[0])}" cy="${f1(bc[1])}" rx="156" ry="23" transform="rotate(${f1(R.ang)} ${f1(bc[0])} ${f1(bc[1])})" fill="${col(C.straw)}" ${OL}/>`;
            if (!S && q.rim) s += curve(Hh(-40, -82), Hh(10, -104), Hh(52, -74), rimC, 4, 'opacity="0.9"');
          }
        } else {
          const hood = col(C.ochre);
          s += smooth([H(-60, 22), H(-68, -40), H(-42, -90), H(10, -102), H(54, -74), H(64, -30), H(60, 12), H(42, 50), H(-22, 58)], hood, OL);
          s += smooth([H(14, -54), H(44, -48), H(54, -22), H(61, -6), H(51, 4), H(49, 26), H(30, 40), H(14, 22), H(8, -18)], col(C.skin), OL);
          if (!S) {
            s += poly([H(8, -58), H(58, -52), H(60, -30), H(8, -32)], C.ink, 'opacity="0.3"');
            s += eye(H(40, -16));
            if (q.mouth === "o") s += `<ellipse cx="${f1(H(46, 24)[0])}" cy="${f1(H(46, 24)[1])}" rx="4" ry="6" fill="${C.ink}"/>`;
            else s += stroke([H(42, 24), H(50, 23)], C.ink, 3);
          }
          // aba do capuz caída sobre os olhos (dormindo)
          if (q.hoodLow) s += smooth([H(6, -60), H(48, -64), H(70, -40), H(66, -6), H(30, -12), H(8, -24)], hood, OL);
          else s += curve(H(10, -60), H(48, -66), H(66, -34), S ? S : C.ink, 14) + (S ? "" : curve(H(10, -60), H(48, -66), H(66, -34), C.ochre, 7));
          if (!S) {
            s += stroke([H(-60, 0), H(-66, -40), H(-40, -88)], C.ink, 3, 'opacity="0.35"');
            if (q.wet) s += smooth([H(-60, 22), H(-68, -40), H(-42, -90), H(10, -102), H(-20, -20)], C.ink, 'opacity="0.2"');
            // cordões do capuz (balançam com flap)
            s += stroke([H(36, 44), H(34 + fl * 3, 74), H(30 + fl * 6, 98)], C.haze, 3) + stroke([H(28, 46), H(22 - fl * 2, 76), H(20 - fl * 4, 96)], C.haze, 3);
            if (q.rim === "back") s += curve(H(-62, 10), H(-74, -50), H(-30, -98), rimC, 5);
            else if (q.rim) s += curve(H(20, -100), H(60, -80), H(66, -30), rimC, 5);
          }
        }
        return s;
      }

      // ---------- cenário comum ----------
      function defs(p) {
        return `<defs>
          <radialGradient id="${p}fogH"><stop offset="0" stop-color="${C.haze}" stop-opacity="0.75"/><stop offset="1" stop-color="${C.haze}" stop-opacity="0"/></radialGradient>
          <radialGradient id="${p}fogF"><stop offset="0" stop-color="${C.fog}" stop-opacity="0.7"/><stop offset="1" stop-color="${C.fog}" stop-opacity="0"/></radialGradient>
          <radialGradient id="${p}glow"><stop offset="0" stop-color="${C.sun}" stop-opacity="0.95"/><stop offset="0.25" stop-color="${C.glow}" stop-opacity="0.6"/><stop offset="1" stop-color="${C.glow}" stop-opacity="0"/></radialGradient>
          <radialGradient id="${p}inkR"><stop offset="0" stop-color="${C.ink}" stop-opacity="0.8"/><stop offset="1" stop-color="${C.ink}" stop-opacity="0"/></radialGradient>
          <filter id="${p}blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="${p}soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>`;
      }
      const lin = (id, stops) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a === undefined ? 1 : a}"/>`).join("")}</linearGradient></defs>`;
      const fogBlob = (p, kind, x, y, rx, ry) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${p}${kind})"/>`;
      function ripples(seed, y0, y1, n, col, op, period) {          // traços de água, periódicos em x
        const r = lcg(seed); let d = "";
        for (let i = 0; i < n; i++) { const y = y0 + Math.pow(r(), 1.4) * (y1 - y0), w = 20 + (y - y0) / (y1 - y0) * 120 * r() + 10, x = r() * period;
          for (let tx = -period; tx < 1080 + period; tx += period) d += `M${f1(x + tx)},${f1(y)} h${f1(w)} `; }
        return `<path d="${d}" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity="${op}" fill="none"/>`;
      }
      function sunPath(seed, cx, y0, y1, spread) {                 // reflexo do sol na água (3 desenhos trocados em um)
        const r = lcg(seed); let s = "";
        for (let i = 0; i < 26; i++) { const t = r(), y = y0 + t * (y1 - y0), w = 14 + t * 80 * r(), x = cx + (r() - 0.5) * spread * (0.3 + t);
          s += stroke([[x - w / 2, y], [x + w / 2, y]], i % 3 ? C.glow : C.sun, 3 + t * 5, `opacity="${f1(0.9 - t * 0.5)}"`); }
        return s;
      }
      function reeds(seed, x0, x1, base, h, n, col) {
        const r = lcg(seed); let s = "";
        for (let i = 0; i < n; i++) { const x = x0 + r() * (x1 - x0), hh = h * (0.5 + r() * 0.6), lean = (r() - 0.5) * 80;
          s += `<path d="M${f1(x - 7)},${base} Q${f1(x + lean * 0.4)},${f1(base - hh * 0.6)} ${f1(x + lean)},${f1(base - hh)} Q${f1(x + lean * 0.4 + 6)},${f1(base - hh * 0.6)} ${f1(x + 7)},${base} Z" fill="${col}"/>`;
          if (r() < 0.4) s += `<ellipse cx="${f1(x + lean)}" cy="${f1(base - hh)}" rx="9" ry="30" transform="rotate(${f1(lean * 0.4)} ${f1(x + lean)} ${f1(base - hh)})" fill="${col}"/>`; }
        return s;
      }
      function treeline(seed, x0, x1, y, h, col, op) {
