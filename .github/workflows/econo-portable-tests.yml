name: Econo portable workflow tests
on:
  pull_request:
    paths:
      - 'skills/econodescomplicada-videos/**'
      - '.github/workflows/econo-portable-tests.yml'
  push:
    paths:
      - 'skills/econodescomplicada-videos/**'
      - '.github/workflows/econo-portable-tests.yml'
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile preflight
        run: python -m compileall -q skills/econodescomplicada-videos/scripts
      - name: Run offline tests
        run: python -m unittest discover -s skills/econodescomplicada-videos/tests -v
